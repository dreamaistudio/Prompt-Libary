[build]
  publish = "public"
  functions = "netlify/functions"

# Netlify Functions redirect: route /api/* directly to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Legacy static redirect to ensure backwards compatibility with any cached /static/ references
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# SPA catch-all routing: routes all page navigation to /index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# PWA service worker and manifest caching headers
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "max-age=0, no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
